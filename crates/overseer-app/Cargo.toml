[package]
name = "overseer-app"
description = "The Valorant Overseer window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "overseer"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
global-hotkey.workspace = true
tray-icon.workspace = true
serde.workspace = true
serde_json.workspace = true
overseer-core = { path = "../overseer-core", version = "2.1.0" }
overseer-ui = { path = "../overseer-ui", version = "2.1.0" }
overseer-native = { path = "../overseer-native", version = "2.1.0" }
# Already in the tree through winit. It hands the window's handle to
# overseer-native, which plays clips in a child of the window.
raw-window-handle = "0.6.2"

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
