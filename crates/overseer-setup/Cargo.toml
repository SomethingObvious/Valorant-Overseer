[package]
name = "overseer-setup"
description = "The Valorant Overseer installer, as a window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "overseer-setup"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
overseer-ui = { path = "../overseer-ui", version = "2.34.0" }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
